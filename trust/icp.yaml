# kebab-stack trust — Internet Computer project config (icp CLI).
# Development/bootstrap build configuration. Install and update production through
# Hub → Apps / the shared release executor; preserve tracked placeholders.
# See INSTALL.md and ../kitchen/INSTALL.md.

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Trust"
        __META_PROJECT_ID: "kebabstack-trust"
        __META_NAME: "Backend"

  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: dist
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Trust"
        __META_PROJECT_ID: "kebabstack-trust"
        __META_NAME: "Frontend"
        __META_MAIN_CANISTER: "true"
        __META_ICON_PATH: "/favicon.svg"
