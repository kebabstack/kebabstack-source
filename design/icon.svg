<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- KebabStack icon: the skewer is the hub, every layer is a tool -->
  <defs>
    <linearGradient id="grill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB23A"/>
      <stop offset="1" stop-color="#F0503C"/>
    </linearGradient>
  </defs>
  <!-- skewer handle (ring) -->
  <circle cx="64" cy="16" r="7" fill="none" stroke="#E8EDF3" stroke-width="5"/>
  <!-- skewer rod -->
  <rect x="61" y="22" width="6" height="98" rx="3" fill="#E8EDF3"/>
  <!-- layers, hand-cut widths -->
  <rect x="38" y="38" width="52" height="14" rx="7" fill="#FFB23A"/>
  <rect x="28" y="56" width="72" height="14" rx="7" fill="#FF8A3D"/>
  <rect x="34" y="74" width="60" height="14" rx="7" fill="#FF6B4A"/>
  <rect x="43" y="92" width="42" height="14" rx="7" fill="#F0503C"/>
</svg>
