# kebab-stack watch — Internet Computer project config (icp CLI).
# The release service builds this recipe and configures deployment placeholders.
# Install/update through Hub → Apps; see INSTALL.md.

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Watch"
        __META_PROJECT_ID: "kebabstack-watch"
        __META_NAME: "Backend"

  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: dist
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Watch"
        __META_PROJECT_ID: "kebabstack-watch"
        __META_NAME: "Frontend"
        __META_MAIN_CANISTER: "true"
        __META_ICON_PATH: "/favicon.svg"
