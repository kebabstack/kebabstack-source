[package]
name = "kebabstack-watch"
version = "0.10.1"
description = "kebab-stack watch — the company's domains watched: DNS changes, posture, certificates, lookalikes, expiry, with the evidence"

[toolchain]
moc = "1.12.0"

[dependencies]
core = "2.6.1"
json = "1.4.0"
kebab-hub = "../sdk/motoko"

[canisters.backend]
main = "backend/main.mo"

[build]
outputDir = "backend/dist"
