# kebab-stack bug2d — Internet Computer project config (icp CLI).
# Two NEW canisters; never bind this module to the existing 3D deployment.
# The frontend reads certified runtime canister IDs. Set PUBLIC_HUB_URL per install.
# See INSTALL.md.

# Deploy to your engine with the implicit `ic` environment: icp deploy -e ic --subnet <SUBNET-ID>
# (no custom environment — the console labels below travel with the canisters).

canisters:
  - name: backend
    build:
      steps:
        - type: script
          commands:
            - node tools/backend-build.mjs
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Bug 2D"
        __META_PROJECT_ID: "kebabstack-bug2d"
        __META_NAME: "Backend"

  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: dist
        metadata:
          - name: service:version
            value: "0.2.0"
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Bug 2D"
        __META_PROJECT_ID: "kebabstack-bug2d"
        __META_NAME: "Frontend"
        __META_MAIN_CANISTER: "true"
        __META_ICON_PATH: "/favicon.svg"
