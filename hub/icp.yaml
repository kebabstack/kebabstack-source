# KebabStack Hub — Internet Computer project config (icp CLI).
#
# Standalone canister pair (backend + static frontend). No committed
# canister-id mappings: deploy the backend first, patch the
# __BACKEND_CANISTER_ID__ placeholder in dist/index.html, then deploy the
# frontend. See docs/ for the full install flow.

# Deploy to your engine with the implicit `ic` environment: icp deploy -e ic --subnet <SUBNET-ID>
# (no custom environment — the console labels below travel with the canisters).

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Hub"
        __META_PROJECT_ID: "kebabstack-hub"
        __META_NAME: "Backend"

  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: dist
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Hub"
        __META_PROJECT_ID: "kebabstack-hub"
        __META_NAME: "Frontend"
        __META_MAIN_CANISTER: "true"
        __META_ICON_PATH: "/favicon.svg"
