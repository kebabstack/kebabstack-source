# kitchen feasibility probe — deploy once, call `probe`, read the report, delete.
environments:
  - name: prod
    network: ic
    canisters: [backend]
    settings:
      backend:
        environment_variables:
          __META_PROJECT: "KebabStack Kitchen Probe"
          __META_PROJECT_ID: "kebabstack-kitchen-probe"
          __META_NAME: "Probe"
          __META_MAIN_CANISTER: "true"

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
