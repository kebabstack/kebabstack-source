[package]
name = "kebabstack-kitchen"
version = "0.8.3"
description = "kebab-stack kitchen — the installer/updater: cooks apps from recipes, keeps them fresh, hands them to the vault"

[toolchain]
moc = "1.12.0"

[dependencies]
core = "2.6.1"
json = "1.4.0"
sha2 = "0.1.14"

[canisters.backend]
main = "backend/main.mo"

[build]
outputDir = "backend/dist"
