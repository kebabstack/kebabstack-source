# Crumbs backend/frontend build recipes. For rollout use the identical tested
# format-2 artifact via Kitchen; see INSTALL.md. Native collection runs in the backend canister; Node is optional.

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Crumbs"
        __META_PROJECT_ID: "kebabstack-crumbs"
        __META_NAME: "Backend"

  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: dist
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Crumbs"
        __META_PROJECT_ID: "kebabstack-crumbs"
        __META_NAME: "Frontend"
        __META_MAIN_CANISTER: "true"
        __META_ICON_PATH: "/favicon.svg"
