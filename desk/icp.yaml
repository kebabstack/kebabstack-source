# kebab-stack desk — Internet Computer project config (icp CLI).
# Two canisters: Motoko backend + static frontend. Deploy backend first, patch
# Backend IDs in dist/app.js and dist/support.js; Hub URL in dist/app.js.
# See INSTALL.md.

# Deploy to your engine with the implicit `ic` environment: icp deploy -e ic --subnet <SUBNET-ID>
# (no custom environment — the console labels below travel with the canisters).

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Desk"
        __META_PROJECT_ID: "kebabstack-desk"
        __META_NAME: "Backend"

  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: dist
    settings:
      environment_variables:
        __META_PROJECT: "KebabStack Desk"
        __META_PROJECT_ID: "kebabstack-desk"
        __META_NAME: "Frontend"
        __META_MAIN_CANISTER: "true"
        __META_ICON_PATH: "/favicon.svg"
