<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>On-call · Desk preview</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/desk.css"><link rel="stylesheet" href="/oncall.css"><link rel="stylesheet" href="/reporting.css"><link rel="stylesheet" href="/service-status.css"><style>.preview-topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 28px;border-bottom:1px solid var(--desk-line);background:var(--desk-surface);gap:20px}.preview-brand{display:flex;align-items:center;gap:12px}.preview-brand strong{font-size:20px}.preview-brand small{display:block;color:var(--desk-muted);font-size:10px;letter-spacing:1.5px}.preview-controls{display:flex;align-items:center;gap:12px}.preview-controls>span{font-size:11px;color:var(--desk-muted)}#layout{display:block!important}.desk-nav{position:static}.desk-nav .navstep{display:flex;width:100%;gap:12px;text-decoration:none}.preview-controls select{max-width:210px}.preview-topbar button{min-height:35px}@media(max-width:700px){.preview-topbar{padding:12px 16px;flex-wrap:wrap}.preview-controls>span{display:none}.desk-nav{display:none}}</style><link rel="stylesheet" href="/components.css"></head><body class="ks-workspace"><div id="layout" class="on"><header class="preview-topbar"><div class="preview-brand"><span style="color:var(--desk-accent);font-size:27px">✳</span><div><strong>Desk</strong><small>ORBIT LABS</small></div></div><div class="preview-controls"><span>LOCAL PREVIEW · SYNTHETIC DATA</span><label for="previewPerson" class="sr-only">Preview as</label><select id="previewPerson"></select><button id="previewTheme" aria-label="Change color theme">◐</button></div></header><div class="desk-shell"><aside class="desk-nav"><div class="nav-eyebrow">SUPPORT DESK</div><div id="nav"><a class="navstep active" href="#/oncall"><span class="nav-icon">◷</span><span class="nav-label">On-call</span></a></div><div class="navsep"></div><div class="nav-footer"><span class="service-mark">✳</span><div>Your work. Unblocked.<small>Powered by KebabStack</small></div></div></aside><main id="mainContent"><section id="previewRoot"></section></main></div></div><datalist id="groupList"><option value="Operations"></datalist><script type="module">
import {createWorkspaceStatus} from '/service-status.js';
import {createReporting} from '/reporting.js';
import {createOncall} from '/oncall.js';
const encode=x=>JSON.stringify(x,(_,v)=>typeof v==='bigint'?{$bigint:String(v)}:v),decode=x=>JSON.parse(x,(_,v)=>v&&typeof v==='object'&&Object.keys(v).length===1&&'$bigint'in v?BigInt(v.$bigint):v);
const people=await(await fetch('/session')).json(),select=document.getElementById('previewPerson');select.innerHTML=people.map(p=>`<option value="${p.key}">${p.displayName} · ${p.previewRole||(p.role==='admin'?'Admin':'Responder')}</option>`).join('');let me=people.find(p=>p.key===new URL(location.href).searchParams.get('as'))||people[0];select.value=me.key;
const backend=new Proxy({}, {get:(_,method)=>async(_token,...args)=>{const r=await fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:encode({method,args,role:me.key})});const result=decode(await r.text());if(!r.ok)throw Error(result.error||'Preview request failed');return result;}});
const ui=createOncall({root:document.getElementById('previewRoot'),api:()=>backend,session:{load:()=>''},getMe:()=>me,alertBase:location.origin});
const serviceStatus=createWorkspaceStatus({root:document.getElementById('previewRoot'),api:()=>backend,session:{load:()=>''},getMe:()=>me});
const reporting=createReporting({root:document.getElementById('previewRoot'),api:()=>backend,session:{load:()=>''},getMe:()=>me});
function route(){document.getElementById('nav').innerHTML=(me.role!=='requester'?'<a class="navstep" href="#/oncall">◷ On-call</a>':'')+'<a class="navstep" href="#/service-status">◉ Service status</a><a class="navstep" href="#/reporting">≡ Time &amp; compensation</a>'; const[view,id,mode]=location.hash.replace(/^#\/?/,'').split('/');if(view==='service-status'){ui.clear();reporting.clear();serviceStatus.show();return;}serviceStatus.clear();if(view==='reporting'){ui.clear();reporting.show(id||'');return;}reporting.clear();if(me.role==='requester'){location.hash='#/reporting';return;}if(view==='customers'){ui.clear();document.getElementById('previewRoot').innerHTML='<a href="#/oncall">← On-call</a><h2>Customer support</h2><p>This preview focuses on the new on-call module. Existing customer support remains in Desk.</p>';return;}ui.show(id||'',mode||'');}
select.onchange=()=>{serviceStatus.clear();reporting.clear();ui.clear();me=people.find(p=>p.key===select.value);route();};window.addEventListener('hashchange',route);document.getElementById('previewTheme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};if(!location.hash)location.hash='#/oncall';else route();
</script></body></html>
